<div class="cataleg-page">
  <header class="page-header">
    <h1>Catàleg de Productes</h1>
    <p class="subtitle">Productes populars del nostre inventari</p>
  </header>

  <app-formulari-cerca></app-formulari-cerca>
  <!-- Estat: Carregant -->
  <div class="estat-carregant" *ngIf="elementService.carregant()">
    <div class="spinner"></div>
    <p>Carregant elements...</p>
  </div>

  <!-- Estat: Error -->
  <div
    class="estat-error"
    *ngIf="!elementService.carregant() && elementService.error()"
  >
    <div class="error-icon">⚠️</div>
    <h2>Error al carregar productes</h2>
    <p class="error-missatge">{{ elementService.error() }}</p>
    <button class="btn-reintentar" (click)="reintentar()">Reintentar</button>
  </div>

  <!-- Estat: Èxit (elements carregats) -->
  <div
    class="estat-exit"
    *ngIf="!elementService.carregant() && !elementService.error()"
  >
    <!-- Missatge si no hi ha elements -->
    <div class="sense-resultats" *ngIf="elementService.elements().length === 0">
      <p>No s'han trobat productes populars</p>
    </div>

    <!-- Llistat d'elements -->
    <cdk-virtual-scroll-viewport
      class="viewport"
      [itemSize]="alcadaElement"
      *ngIf="elementsVirtualitzats().length > 0"
    >
      <div
        class="element-virtual"
        *cdkVirtualFor="let element of elementsVirtualitzats()"
      >
        <app-targeta-producte [producte]="element"></app-targeta-producte>
      </div>
    </cdk-virtual-scroll-viewport>
  </div>
</div>
