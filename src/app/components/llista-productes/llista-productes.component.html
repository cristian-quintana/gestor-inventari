<section aria-label="Llistat de productes">
  <div class="info-resultats" aria-live="polite">
    {{ productes.length }} resultats trobats
  </div>
  <br />

  <section
    *ngIf="productes.length > 0; else senseResultats"
    class="graella-productes"
  >
    <app-targeta-producte
      *ngFor="let producte of productes; trackBy: trackByElementId"
      [producte]="producte"
    >
    </app-targeta-producte>
  </section>

  <ng-template #senseResultats>
    <p class="sense-resultats" role="alert" aria-live="assertive">
      No s'han trobat resultats.
    </p>
  </ng-template>
</section>
