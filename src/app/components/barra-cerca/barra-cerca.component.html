<form class="barra-cerca" #formulari="ngForm" (ngSubmit)="enviarCerca()">
  <label for="cerca">Cerca productes</label>

  <input
    id="cerca"
    name="cerca"
    type="text"
    placeholder="Escriu un nom o categoria"
    [(ngModel)]="textCerca"
    minlength="3"
    #cercaInput="ngModel"
    aria-describedby="error-cerca"
  />

  <p
    id="error-cerca"
    class="missatge-error"
    *ngIf="cercaInput.invalid && cercaInput.touched"
    role="alert"
    aria-live="assertive"
  >
    La cerca ha de tenir almenys 3 caràcters.
  </p>

  <button
    type="submit"
    [disabled]="formulari.invalid"
    aria-label="Cercar elements"
  >
    Cercar
  </button>
</form>
